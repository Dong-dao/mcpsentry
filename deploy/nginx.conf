map $request_method $write_key {
    default "";
    POST $server_name;
}

limit_req_zone $write_key zone=public_writes:1m rate=6r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Batch jobs are SSH-only on the shared two-core demo server.
    location = /api/matrix {
        default_type application/json;
        return 403 '{"detail":"Public demo: batch runs are disabled; use a single run or SSH."}';
    }

    location /api/ {
        limit_req zone=public_writes burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 75s;
    }

    location = /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location ~ /\. {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
